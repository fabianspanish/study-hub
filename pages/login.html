<div class="login-shell">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">Study Hub<span class="dot">.</span></div>
      <div class="login-tag">Acesso restrito · Pessoal</div>
    </div>

    <div class="login-tabs" role="tablist">
      <button class="login-tab active" data-tab="signin" role="tab">Entrar</button>
      <button class="login-tab" data-tab="signup" role="tab">Criar conta</button>
    </div>

    <div class="login-body">

      <!-- Mensagens (preenchidas via JS) -->
      <div id="login-message-slot"></div>

      <!-- ============ TAB: SIGN IN ============ -->
      <form id="signin-form" class="login-form" autocomplete="on" novalidate>
        <div class="login-field">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" name="email" autocomplete="email" required>
        </div>
        <div class="login-field">
          <label for="signin-password">Senha</label>
          <input type="password" id="signin-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn login-btn-primary" id="signin-submit">Entrar</button>

        <div class="login-divider">ou</div>

        <button type="button" class="login-btn login-btn-google" id="signin-google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.75h3.57c2.08-1.92 3.28-4.74 3.28-8.07z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC04" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Entrar com Google
        </button>

        <div class="login-footer">
          <a id="forgot-link">Esqueci minha senha</a>
        </div>
      </form>

      <!-- ============ TAB: SIGN UP ============ -->
      <form id="signup-form" class="login-form" autocomplete="on" novalidate style="display:none">
        <div class="login-field">
          <label for="signup-name">Nome completo</label>
          <input type="text" id="signup-name" name="name" autocomplete="name" required minlength="2" maxlength="80">
        </div>
        <div class="login-field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" autocomplete="email" required>
        </div>
        <div class="login-field">
          <label for="signup-phone">Telefone (opcional)</label>
          <input type="tel" id="signup-phone" name="phone" autocomplete="tel" placeholder="(11) 99999-9999">
        </div>
        <div class="login-field">
          <label for="signup-password">Senha</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required>
          <div class="login-pwmeter" aria-hidden="true">
            <div class="login-pwmeter-bar"></div>
            <div class="login-pwmeter-bar"></div>
            <div class="login-pwmeter-bar"></div>
            <div class="login-pwmeter-bar"></div>
          </div>
          <div class="login-pwhint" id="signup-pwhint">
            Mínimo 10 caracteres, com maiúscula, minúscula, número e especial
          </div>
        </div>
        <div class="login-field">
          <label for="signup-password2">Confirmar senha</label>
          <input type="password" id="signup-password2" name="password2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="login-btn login-btn-primary" id="signup-submit">Criar conta</button>

        <div class="login-divider">ou</div>

        <button type="button" class="login-btn login-btn-google" id="signup-google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.75h3.57c2.08-1.92 3.28-4.74 3.28-8.07z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC04" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continuar com Google
        </button>
      </form>

      <!-- ============ TAB: FORGOT (modal-like) ============ -->
      <form id="forgot-form" class="login-form" autocomplete="off" novalidate style="display:none">
        <div class="login-message info">
          Vamos te enviar um link para redefinir sua senha. Verifique sua caixa de entrada (e spam).
        </div>
        <div class="login-field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="login-btn login-btn-primary" id="forgot-submit">Enviar link</button>
        <div class="login-footer">
          <a id="forgot-back">← Voltar para login</a>
        </div>
      </form>

    </div>
  </div>
</div>
